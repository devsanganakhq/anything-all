name: Submit Heathland Links iOS build 9 with app-specific password

jobs:
  submit_ios:
    environment: preview
    env:
      HEATHLAND_CLIENT_PROJECT: "1"
    steps:
      - uses: eas/checkout
      - run: npm ci --include=dev
      - run: npx eas-cli@latest submit --platform ios --id 9799c98c-aa61-4993-af1e-e331185b81a5 --profile client-testflight --non-interactive --wait
