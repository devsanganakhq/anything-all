name: Submit Heathland Links iOS build 10 with app-specific password

jobs:
  submit_ios:
    environment: preview
    env:
      HEATHLAND_CLIENT_PROJECT: "1"
    steps:
      - uses: eas/checkout
      - run: npm ci --include=dev
      - run: npx eas-cli@latest submit --platform ios --id 38a83025-9720-474e-b3f7-70353bea5e70 --profile client-testflight --non-interactive --wait
